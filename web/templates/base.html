<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scry{% endblock %}</title>
  <style>
    :root {
      /* neutraller — soğuk çelik, çok düşük kroma */
      --bg: oklch(0.155 0.006 225);
      --surface: oklch(0.190 0.007 225);
      --surface-2: oklch(0.230 0.009 225);
      --border: oklch(0.285 0.010 225);
      --border-strong: oklch(0.360 0.012 225);
      --ink: oklch(0.955 0.004 225);
      --muted: oklch(0.700 0.008 225);
      --faint: oklch(0.520 0.008 225);

      /* marka — soğuk çelik-camgöbeği (etkileşim + sağlıklı) */
      --primary: oklch(0.760 0.105 210);
      --primary-fill: oklch(0.800 0.100 205);
      --on-primary: oklch(0.180 0.020 225);

      /* severity — tehlike gradyanı */
      --sev-crit: oklch(0.680 0.205 25);
      --sev-high: oklch(0.750 0.165 55);
      --sev-med: oklch(0.830 0.135 82);
      --sev-low: oklch(0.700 0.028 235);
      --sev-none: oklch(0.640 0.006 225);

      --font-sans: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

      --r-sm: 6px; --r: 9px; --r-lg: 13px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);

      --z-header: 100;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--font-sans); font-size: 0.9375rem; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 2px; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px;
      border-radius: 3px; }

    /* ---------- Üst bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: var(--z-header);
      display: flex; align-items: center; gap: 28px;
      padding: 0 24px; height: 56px;
      background: color-mix(in oklab, var(--surface) 82%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 640;
      font-size: 0.95rem; letter-spacing: -0.01em; }
    .brand .mark { width: 11px; height: 11px; border-radius: 3px;
      background: var(--sev-crit);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--sev-crit) 22%, transparent); }
    .brand b { font-weight: 720; }
    .nav { display: flex; gap: 4px; }
    .nav a { color: var(--muted); font-size: 0.85rem; font-weight: 500;
      padding: 6px 11px; border-radius: var(--r-sm); text-decoration: none;
      transition: color .15s var(--ease), background .15s var(--ease); }
    .nav a:hover { color: var(--ink); background: var(--surface-2); }
    .nav a.active { color: var(--ink); background: var(--surface-2); }
    .topbar .spacer { flex: 1; }
    .sched { display: flex; align-items: center; gap: 7px; font-size: 0.78rem;
      color: var(--muted); }
    .sched .dot { width: 7px; height: 7px; border-radius: 50%;
      background: var(--faint); }
    .sched.on .dot { background: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 22%, transparent); }

    /* ---------- Yerleşim ---------- */
    main { max-width: 1120px; margin: 0 auto; padding: 30px 24px 64px; }
    .page-head { margin-bottom: 26px; }
    h1 { font-size: 1.375rem; font-weight: 680; letter-spacing: -0.02em;
      margin: 0 0 5px; text-wrap: balance; }
    .sub { color: var(--muted); font-size: 0.84rem; }
    .section { margin-top: 34px; }
    .section-head { display: flex; align-items: baseline; gap: 10px;
      margin-bottom: 13px; }
    .section-head h2 { font-size: 0.82rem; font-weight: 600; margin: 0;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .section-head .count { font-size: 0.78rem; color: var(--faint);
      font-variant-numeric: tabular-nums; }

    /* ---------- Stat kartları ---------- */
    .stats { display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .stat { position: relative; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r);
      padding: 16px 16px 15px; overflow: hidden; }
    .stat::before { content: ""; position: absolute; inset: 0 0 auto 0;
      height: 2px; background: var(--rule, var(--border-strong)); }
    .stat .n { font-family: var(--font-mono); font-size: 2rem; font-weight: 600;
      line-height: 1; font-variant-numeric: tabular-nums; color: var(--rule, var(--ink)); }
    .stat .l { margin-top: 8px; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); }
    .stat.crit { --rule: var(--sev-crit); }
    .stat.high { --rule: var(--sev-high); }
    .stat.med  { --rule: var(--sev-med); }
    .stat.low  { --rule: var(--sev-low); }
    .stat.total { --rule: var(--primary); }
    .stat.total .n { color: var(--ink); }

    /* ---------- Tablo ---------- */
    .panel { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; padding: 10px 16px; font-size: 0.7rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.055em;
      color: var(--faint); border-bottom: 1px solid var(--border);
      white-space: nowrap; background: var(--surface); }
    tbody td { padding: 12px 16px; font-size: 0.85rem;
      border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .13s var(--ease); }
    tbody tr:hover td { background: var(--surface-2); }
    td .host { font-weight: 560; }
    .mono { font-family: var(--font-mono); font-size: 0.82em;
      font-variant-numeric: tabular-nums; }
    .dim { color: var(--muted); } .faint { color: var(--faint); }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ---------- Rozetler ---------- */
    .badge { display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
      line-height: 1.5; white-space: nowrap; }
    .badge.crit { background: color-mix(in oklab, var(--sev-crit) 16%, transparent); color: var(--sev-crit); }
    .badge.high { background: color-mix(in oklab, var(--sev-high) 15%, transparent); color: var(--sev-high); }
    .badge.med  { background: color-mix(in oklab, var(--sev-med) 15%, transparent); color: var(--sev-med); }
    .badge.low  { background: color-mix(in oklab, var(--sev-low) 18%, transparent); color: oklch(0.820 0.020 235); }
    .badge.none { background: color-mix(in oklab, var(--sev-none) 16%, transparent); color: var(--muted); }
    .badge.ok   { background: color-mix(in oklab, var(--primary) 15%, transparent); color: var(--primary); }
    .badge.verified { background: color-mix(in oklab, var(--primary) 18%, transparent);
      color: var(--primary); border: 1px solid color-mix(in oklab, var(--primary) 45%, transparent); }
    .badge.verified::before { content: "✓"; font-weight: 700; }
    .badge.kev { background: color-mix(in oklab, var(--sev-crit) 20%, transparent);
      color: var(--sev-crit); border: 1px solid color-mix(in oklab, var(--sev-crit) 50%, transparent);
      font-weight: 700; letter-spacing: .02em; }
    .badge.kev::before { content: "⚠"; }
    .badge.dot::before { content: ""; width: 5px; height: 5px; border-radius: 50%;
      background: currentColor; }
    .sev-badges { display: flex; flex-wrap: wrap; gap: 5px; }

    /* durum metinleri */
    .st { font-weight: 560; font-size: 0.8rem; }
    .st.success { color: var(--primary); }
    .st.failed { color: var(--sev-crit); }
    .st.running { color: var(--sev-med); }

    /* ---------- Butonlar / formlar ---------- */
    .btn { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      font-family: inherit; font-size: 0.8rem; font-weight: 600; line-height: 1;
      padding: 8px 13px; border-radius: var(--r-sm); border: 1px solid transparent;
      transition: background .14s var(--ease), border-color .14s var(--ease),
        transform .06s var(--ease); text-decoration: none; }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--primary-fill); color: var(--on-primary); }
    .btn.primary:hover { background: oklch(0.845 0.095 205); text-decoration: none; }
    .btn.ghost { background: var(--surface-2); color: var(--ink); border-color: var(--border-strong); }
    .btn.ghost:hover { background: oklch(0.270 0.010 225); text-decoration: none; }
    .btn.danger { background: transparent; color: var(--sev-crit);
      border-color: color-mix(in oklab, var(--sev-crit) 40%, transparent); }
    .btn.danger:hover { background: color-mix(in oklab, var(--sev-crit) 12%, transparent);
      text-decoration: none; }
    .btn.sm { padding: 6px 10px; font-size: 0.76rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    input, select { font-family: inherit; font-size: 0.83rem; color: var(--ink);
      background: var(--bg); border: 1px solid var(--border-strong);
      border-radius: var(--r-sm); padding: 8px 11px; transition: border-color .14s var(--ease); }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    input::placeholder { color: var(--faint); }
    label.field { display: flex; flex-direction: column; gap: 6px;
      font-size: 0.76rem; color: var(--muted); font-weight: 500; }
    form.inline { display: inline-flex; gap: 8px; align-items: center; }

    /* ---------- Boş durumlar ---------- */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty .big { font-size: 0.95rem; color: var(--ink); font-weight: 560; margin-bottom: 6px; }
    .empty .small { font-size: 0.82rem; }

    /* ---------- Flash ---------- */
    .flash { display: flex; align-items: center; gap: 9px; margin-bottom: 20px;
      padding: 11px 15px; border-radius: var(--r);
      background: color-mix(in oklab, var(--primary) 12%, transparent);
      border: 1px solid color-mix(in oklab, var(--primary) 32%, transparent);
      color: var(--primary); font-size: 0.85rem;
      animation: flash-in .2s var(--ease); }
    @keyframes flash-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    @media (max-width: 640px) {
      .topbar { gap: 14px; padding: 0 15px; }
      main { padding: 22px 15px 48px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark"></span><b>Scry</b></div>
    <nav class="nav">
      <a href="{{ url_for('main.dashboard') }}" class="{{ 'active' if request.endpoint == 'main.dashboard' }}">Pano</a>
      <a href="{{ url_for('main.targets') }}" class="{{ 'active' if request.endpoint == 'main.targets' }}">Hedefler</a>
    </nav>
    <div class="spacer"></div>
    <div class="sched {{ 'on' if scheduler_active }}">
      <span class="dot"></span>{{ 'izleme aktif' if scheduler_active else 'izleme kapalı' }}
    </div>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}
      <div class="flash"><span class="badge ok dot"></span>{{ m }}</div>
      {% endfor %}{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
